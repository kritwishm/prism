[project]
name = "prism"
version = "0.1.0"
description = "Account research → personalized content pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "hubspot-api-client>=11.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
]

[project.scripts]
prism = "run:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]
